version: '3.8'

services:
  cappo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cappo-backend:latest
    container_name: cappo-backend-node
    restart: unless-stopped
    ports:
      - "8002:8002"
      - "162:162/udp" # SNMP Traps
      - "502:502/tcp" # Modbus TCP
    environment:
      # Deployment must inject the database DSN. Never commit credentials or
      # concrete private database topology into the repository.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set by deployment}
      HOST: 0.0.0.0
      PORT: "8002"
    networks:
      - coolify

networks:
  coolify:
    external: true
