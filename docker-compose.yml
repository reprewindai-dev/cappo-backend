version: '3.8'

services:
  cappo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cappo-backend:latest
    container_name: cappo-backend-node
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set by deployment}
      HOST: 0.0.0.0
      PORT: "8002"
    networks:
      - coolify
      - byos

networks:
  coolify:
    external: true
  byos:
    external: true
    name: veklom-byos-backend-2_default
