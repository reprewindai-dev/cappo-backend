http:
  routers:
    capi:
      entryPoints:
        - http
        - https
      rule: "Host(`capi.veklom.com`) || Host(`cappo.veklom.com`)"
      service: capi
      tls:
        certResolver: letsencrypt
  services:
    capi:
      loadBalancer:
        servers:
          - url: "http://cappo-backend-node:8000"