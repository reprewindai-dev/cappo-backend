name: Repair Veklom Public Site Now

on:
  push:
    paths:
      - ".github/workflows/repair-public-site-now.yml"
  workflow_dispatch:

jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Repair Cloudflare tunnel and decouple homepage from local Next.js
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $tunnelId = '0061f2f2-3eaf-4fb6-add3-5916f8cc651c'
          $vercelOrigin = 'veklom-control-plane.vercel.app'

          $cfCandidates = @(
            'C:\Program Files (x86)\cloudflared\cloudflared.exe',
            'C:\Program Files\cloudflared\cloudflared.exe'
          )
          $cfExe = $cfCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cfExe) {
            $cmd = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
            if ($cmd) { $cfExe = $cmd.Source }
          }
          if (-not $cfExe) { throw 'cloudflared.exe not found on the self-hosted runner.' }

          $configCandidates = @(
            'C:\ProgramData\Veklom\cloudflared\config.yml',
            (Join-Path $env:USERPROFILE '.cloudflared\config.yml')
          )
          $config = $configCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $config) { throw 'Existing cloudflared config.yml not found.' }

          $existing = Get-Content $config -Raw
          $credentialMatch = [regex]::Match($existing, '(?mi)^credentials-file:\s*(.+?)\s*$')
          if (-not $credentialMatch.Success) { throw 'Could not recover credentials-file from existing config.' }
          $credentialsFile = $credentialMatch.Groups[1].Value.Trim().Trim('"')
          if (-not (Test-Path $credentialsFile)) { throw "Tunnel credentials file not found: $credentialsFile" }

          $backup = "$config.pre-vercel-origin-$(Get-Date -Format yyyyMMddHHmmss).bak"
          Copy-Item $config $backup -Force

          $newConfig = @"
          tunnel: $tunnelId
          credentials-file: "$credentialsFile"

          ingress:
            - hostname: "api.veklom.com"
              service: http://127.0.0.1:8088
            - hostname: "n8n.veklom.com"
              service: http://127.0.0.1:5678
            - hostname: "app.veklom.com"
              service: https://$vercelOrigin
              originRequest:
                httpHostHeader: $vercelOrigin
                originServerName: $vercelOrigin
            - hostname: "veklom.com"
              service: https://$vercelOrigin
              originRequest:
                httpHostHeader: $vercelOrigin
                originServerName: $vercelOrigin
            - service: http_status:404
          "@
          $newConfig = ($newConfig -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          Set-Content -Path $config -Value $newConfig -Encoding utf8

          & $cfExe tunnel --config $config ingress validate
          if ($LASTEXITCODE -ne 0) {
            Copy-Item $backup $config -Force
            throw 'New ingress config failed validation; original config restored.'
          }

          Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $logDir = Join-Path $env:USERPROFILE '.veklom\logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $stdout = Join-Path $logDir 'cloudflared-public-site.out.log'
          $stderr = Join-Path $logDir 'cloudflared-public-site.err.log'

          $args = @('tunnel','--config',$config,'run',$tunnelId)
          $proc = Start-Process -FilePath $cfExe -ArgumentList $args -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
          Write-Host "cloudflared started PID=$($proc.Id) config=$config"

          # Persist connector across restarts where the runner account has sufficient rights.
          try {
            $taskName = 'cloudflared-veklom-edge'
            $taskArgs = "tunnel --config `"$config`" run $tunnelId"
            $action = New-ScheduledTaskAction -Execute $cfExe -Argument $taskArgs
            $triggers = @(
              (New-ScheduledTaskTrigger -AtStartup),
              (New-ScheduledTaskTrigger -AtLogOn)
            )
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit (New-TimeSpan -Days 3650)
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $triggers -Settings $settings -Description 'Persistent Veklom Cloudflare Tunnel connector' -RunLevel Highest | Out-Null
            Write-Host "Persistent scheduled task installed: $taskName"
          } catch {
            Write-Warning "Could not install elevated scheduled task from runner account: $($_.Exception.Message)"
          }

          Start-Sleep -Seconds 12

          & $cfExe tunnel info $tunnelId

          $vercelHealth = Invoke-WebRequest -Uri "https://$vercelOrigin/api/health" -UseBasicParsing -TimeoutSec 20
          if ($vercelHealth.StatusCode -ne 200) { throw "Vercel origin unhealthy: HTTP $($vercelHealth.StatusCode)" }
          Write-Host "Vercel health: HTTP $($vercelHealth.StatusCode)"

          $public = Invoke-WebRequest -Uri 'https://veklom.com/' -UseBasicParsing -TimeoutSec 30
          if ($public.StatusCode -ne 200) { throw "veklom.com unhealthy after repair: HTTP $($public.StatusCode)" }
          Write-Host "VEKLOM_PUBLIC_SITE_REPAIRED HTTP $($public.StatusCode)"

          if (Test-Path $stderr) {
            Write-Host '--- cloudflared stderr tail ---'
            Get-Content $stderr -Tail 40 -ErrorAction SilentlyContinue
          }
