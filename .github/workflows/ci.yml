name: Cappo Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & Type Check ────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: pip install ruff

      - name: Ruff lint (exclude generated migrations and vendored code)
        run: ruff check . --exclude tmp_x402,migrations/versions

  # ── 2. Build Docker image ───────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cappo-backend-ci:${{ github.sha }} .

      - name: Validate imports inside container
        run: |
          docker run --rm \
            -e DATABASE_URL="postgresql+psycopg2://test:test@localhost/test" \
            -e SECRET_KEY="ci-test-secret-key" \
            -e ENVIRONMENT="test" \
            -e CAPPO_SKIP_MIGRATIONS="1" \
            cappo-backend-ci:${{ github.sha }} \
            python3 -c "
          import fastapi, uvicorn, sqlalchemy, pydantic, httpx, cryptography
          print('All critical imports OK')
          "

  # ── 3. PostgreSQL-backed tests ──────────────────────────────────────────────
  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cappo
          POSTGRES_PASSWORD: cappo_ci
          POSTGRES_DB: cappo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+psycopg2://cappo:cappo_ci@localhost:5432/cappo_test"
      SECRET_KEY: "ci-test-secret-key"
      ENVIRONMENT: "test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" psycopg2-binary aiosqlite

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q --tb=short --maxfail=1

# Production deployment is intentionally not performed from GitHub-hosted CI.
# The retired deployment job targeted a Hetzner/Coolify host and was not the
# canonical owned-hardware runtime. Re-enable deployment only through a verified
# owned-hardware runner/transport that resolves the deployed source SHA and
# preserves the runtime evidence boundary.
