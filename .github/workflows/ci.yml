name: Cappo Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Runtime integrity and boundary lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: pip install ruff

      - name: Compile maintained runtime
        run: python -m compileall -q cappo_backend

      - name: Reject fatal Python defects across maintained runtime
        run: ruff check cappo_backend --select E9,F63,F7,F82

      - name: Lint the authority, execution, and proof boundary strictly
        run: |
          ruff check \
            cappo_backend/api/routers/exec_router.py \
            cappo_backend/api/routers/execution_proof_router.py \
            cappo_backend/authorization/cappo_auth.py \
            cappo_backend/identity/middleware.py \
            cappo_backend/identity/validator.py \
            cappo_backend/security/http_signatures.py \
            cappo_backend/services/consequence_lifecycle.py \
            cappo_backend/services/orchestrator.py \
            tests/test_consequence_lifecycle_executor.py \
            tests/test_execution_evidence_lifecycle.py \
            tests/test_execution_proof_projection.py \
            tests/test_exec_protection.py \
            tests/adversarial/test_wid_2_token_validation_middleware.py

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cappo-backend-ci:${{ github.sha }} .

      - name: Validate imports inside container
        run: |
          docker run --rm \
            --entrypoint python3 \
            -e DATABASE_URL="postgresql+psycopg2://test:test@localhost/test" \
            -e SECRET_KEY="ci-test-secret-key" \
            -e ENVIRONMENT="test" \
            -e CAPPO_SKIP_MIGRATIONS="1" \
            cappo-backend-ci:${{ github.sha }} \
            -c "
          import fastapi, uvicorn, sqlalchemy, pydantic, httpx, cryptography
          import cappo_backend.main
          print('All critical imports OK')
          "

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cappo
          POSTGRES_PASSWORD: cappo_ci
          POSTGRES_DB: cappo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+psycopg2://cappo:cappo_ci@localhost:5432/cappo_test"
      RLS_DATABASE_URL: "postgresql+psycopg2://cappo_app:cappo_app_ci@localhost:5432/cappo_test"
      SECRET_KEY: "ci-test-secret-key"
      ENVIRONMENT: "test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]" psycopg2-binary aiosqlite

      - name: Run migrations
        run: alembic upgrade head

      - name: Create non-bypass application role for RLS proof
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"], isolation_level="AUTOCOMMIT")
          with engine.connect() as conn:
              conn.execute(text("DROP ROLE IF EXISTS cappo_app"))
              conn.execute(
                  text(
                      "CREATE ROLE cappo_app LOGIN PASSWORD 'cappo_app_ci' "
                      "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
                  )
              )
              conn.execute(text("GRANT CONNECT ON DATABASE cappo_test TO cappo_app"))
              conn.execute(text("GRANT USAGE ON SCHEMA public TO cappo_app"))
              conn.execute(
                  text(
                      "GRANT SELECT, INSERT, UPDATE, DELETE "
                      "ON ALL TABLES IN SCHEMA public TO cappo_app"
                  )
              )
              conn.execute(
                  text(
                      "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO cappo_app"
                  )
              )
          PY

      - name: Run tests
        run: pytest -q --tb=short --maxfail=1

  deploy-prod:
    name: Deploy to Production
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/veklom-deploy
          chmod 600 ~/.ssh/veklom-deploy
          ssh-keyscan -H 5.78.135.11 >> ~/.ssh/known_hosts

      - name: Pull, Build, and Swap on Server
        run: |
          ssh -i ~/.ssh/veklom-deploy root@5.78.135.11 "
            set -e
            SRC=/data/coolify/applications/cappo-backend
            APP=/data/coolify/applications/yen2fecq8burtsgqrm2b988e
            TAG=yen2fecq8burtsgqrm2b988e:${{ github.sha }}

            cd \$SRC
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker build -t \$TAG .

            cd \$APP
            cp docker-compose.yaml docker-compose.yaml.pre-${{ github.sha }}
            sed -i \"s#^\\([[:space:]]*\\)image: .*#\\1image: '\$TAG'#\" docker-compose.yaml
            docker compose -f docker-compose.yaml config >/tmp/cappo-compose-config.out
            docker compose -f docker-compose.yaml up -d --force-recreate
            echo 'Deployment complete for cappo-backend'
          "

      - name: Verify Production Health
        run: |
          sleep 10
          HTTP=$(curl -sk https://cappo.veklom.com/health -o /dev/null -w '%{http_code}')
          if [ "$HTTP" != "200" ]; then
            echo "HEALTH CHECK FAILED: cappo.veklom.com returned $HTTP"
            exit 1
          fi
          echo "cappo.veklom.com healthy — deployment successful"
