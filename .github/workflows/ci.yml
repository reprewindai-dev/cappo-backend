name: Cappo Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & Type Check ────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev deps
        run: pip install ruff

      - name: Ruff lint (exclude vendored dirs)
        run: ruff check . --exclude tmp_x402,migrations/versions --ignore E402,E701,F401,F841,F811

  # ── 2. Build Docker image ───────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cappo-backend-ci:${{ github.sha }} .

      - name: Validate imports inside container
        run: |
          docker run --rm \
            -e DATABASE_URL="postgresql+psycopg2://test:test@localhost/test" \
            -e SECRET_KEY="ci-test-secret-key" \
            -e ENVIRONMENT="test" \
            -e CAPPO_SKIP_MIGRATIONS="1" \
            cappo-backend-ci:${{ github.sha }} \
            python3 -c "
          import fastapi, uvicorn, sqlalchemy, pydantic, httpx, cryptography
          print('All critical imports OK')
          "

  # ── 3. Tests ────────────────────────────────────────────────────────────────
  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cappo
          POSTGRES_PASSWORD: cappo_ci
          POSTGRES_DB: cappo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+psycopg2://cappo:cappo_ci@localhost:5432/cappo_test"
      SECRET_KEY: "ci-test-secret-key"
      ENVIRONMENT: "test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]" psycopg2-binary aiosqlite

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q --tb=short

  # ── 4. Deploy ───────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/veklom-deploy
          chmod 600 ~/.ssh/veklom-deploy
          ssh-keyscan -H 5.78.135.11 >> ~/.ssh/known_hosts

      - name: Pull, Build, and Swap on Server
        run: |
          ssh -i ~/.ssh/veklom-deploy root@5.78.135.11 "
            set -e
            SRC=/data/coolify/applications/cappo-backend
            APP=/data/coolify/applications/yen2fecq8burtsgqrm2b988e
            TAG=yen2fecq8burtsgqrm2b988e:${{ github.sha }}

            cd \$SRC
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker build -t \$TAG .

            cd \$APP
            cp docker-compose.yaml docker-compose.yaml.pre-${{ github.sha }}
            TAG=\$TAG python3 -c 'import os; from pathlib import Path; p=Path("docker-compose.yaml"); tag=os.environ["TAG"]; lines=p.read_text().splitlines(); matches=[i for i,l in enumerate(lines) if l.lstrip().startswith("image: ")]; assert matches, "image line not found"; i=matches[0]; indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]; lines[i]="{}image: {!r}".format(indent, tag); p.write_text("\n".join(lines)+"\n")'
            docker compose -f docker-compose.yaml config >/tmp/cappo-compose-config.out
            docker compose -f docker-compose.yaml up -d --force-recreate
            echo 'Deployment complete for cappo-backend'
          "

      - name: Verify Production Health
        run: |
          sleep 10
          HTTP=$(curl -sk https://cappo.veklom.com/health -o /dev/null -w '%{http_code}')
          if [ "$HTTP" != "200" ]; then
            echo "HEALTH CHECK FAILED: cappo.veklom.com returned $HTTP"
            exit 1
          fi
          echo "cappo.veklom.com healthy — deployment successful"
