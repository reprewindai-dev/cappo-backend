name: Resume CAPPO activation correction

on:
  push:
    branches: [devin/cappo-consequence-execute]

permissions:
  contents: write

concurrency:
  group: resume-cappo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///:memory:
      SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devin/cappo-consequence-execute
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply narrow mount-survival correction and hostile tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('cappo_backend/capability_mount/service.py')
          text = service.read_text(encoding='utf-8')
          old = '''        def terminal_deny(
              reason: str,
              record: MountRecord,
          ) -> tuple[Decision, str, str | None, dict[str, Any]]:
              termination, _termination_reason, _termination_anchor = self.terminate(
                  mount_id,
                  UnmountReason.TASK_COMPLETE,
                  owner_principal=owner_principal,
                  owner_workspace=owner_workspace,
              )
              terminated = termination is Decision.ALLOW
              return (
                  Decision.DENY,
                  reason,
                  None,
                  payload(
                      record=record,
                      decision=Decision.DENY,
                      reason=reason,
                      terminated=terminated,
                  ),
              )
  '''
          new = '''        def preflight_deny(
              reason: str,
              record: MountRecord,
          ) -> tuple[Decision, str, str | None, dict[str, Any]]:
              # Malformed/pre-authorization requests consume no authority. Fail closed,
              # invoke no target, and preserve the one-shot mount for a corrected request.
              return (
                  Decision.DENY,
                  reason,
                  None,
                  payload(
                      record=record,
                      decision=Decision.DENY,
                      reason=reason,
                      terminated=False,
                  ),
              )
  '''
          if old not in text:
              raise SystemExit('expected terminal_deny block not found')
          text = text.replace(old, new, 1)
          if text.count('return terminal_deny(') != 4:
              raise SystemExit(f'expected 4 terminal_deny call sites, found {text.count("return terminal_deny(")}')
          text = text.replace('return terminal_deny(', 'return preflight_deny(')
          service.write_text(text, encoding='utf-8')

          tests = Path('tests/capability_mount/test_execute_consequence.py')
          t = tests.read_text(encoding='utf-8')
          marker = 'def test_preflight_wrong_token_preserves_mount_for_corrected_request('
          if marker not in t:
              t += r'''


def test_preflight_wrong_token_preserves_mount_for_corrected_request(
    client: TestClient, tmp_path: Path
) -> None:
    mount, adapter = prepare(client, tmp_path)
    bad = execute_payload(mount, token_id="wrong-token")
    first = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute", json=bad
    ).json()
    assert first["decision"] == "deny"
    assert first["reason"] == "token_mismatch"
    assert first["consequence"]["terminated"] is False
    assert adapter.invocation_count == 0

    second = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount),
    ).json()
    assert second["decision"] == "allow"
    assert adapter.invocation_count == 1


def test_preflight_unknown_target_preserves_mount_for_corrected_request(
    client: TestClient, tmp_path: Path
) -> None:
    mount, adapter = prepare(client, tmp_path)
    first = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount, target_ref="missing.target"),
    ).json()
    assert first["decision"] == "deny"
    assert first["reason"] == "unknown_effect_target"
    assert first["consequence"]["terminated"] is False
    assert adapter.invocation_count == 0

    second = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount),
    ).json()
    assert second["decision"] == "allow"
    assert adapter.invocation_count == 1


def test_preflight_unmapped_action_preserves_mount_for_corrected_request(
    client: TestClient, tmp_path: Path
) -> None:
    mount, adapter = prepare(client, tmp_path, CreateOnlyAdapter(tmp_path))
    first = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount, action="record.delete"),
    ).json()
    assert first["decision"] == "deny"
    assert first["reason"] == "effect_not_mapped"
    assert first["consequence"]["terminated"] is False
    assert adapter.invocation_count == 0

    second = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount),
    ).json()
    assert second["decision"] == "allow"
    assert adapter.invocation_count == 1


def test_preflight_invalid_resource_preserves_mount_for_corrected_request(
    client: TestClient, tmp_path: Path
) -> None:
    mount, adapter = prepare(client, tmp_path)
    first = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount, resource="../admin"),
    ).json()
    assert first["decision"] == "deny"
    assert first["reason"] == "invalid_effect_resource"
    assert first["consequence"]["terminated"] is False
    assert adapter.invocation_count == 0

    second = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount),
    ).json()
    assert second["decision"] == "allow"
    assert adapter.invocation_count == 1


def test_valid_policy_deny_terminates_one_shot_mount(
    client: TestClient, tmp_path: Path
) -> None:
    mount, adapter = prepare(client, tmp_path)
    first = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount, action="record.delete"),
    ).json()
    assert first["decision"] == "deny"
    assert first["reason"] == "blocked_action"
    assert first["consequence"]["terminated"] is True
    assert adapter.invocation_count == 0

    second = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount),
    ).json()
    assert second["decision"] == "deny"
    assert adapter.invocation_count == 0


def test_successful_consequence_attempt_terminates_mount(
    client: TestClient, tmp_path: Path
) -> None:
    mount, adapter = prepare(client, tmp_path)
    first = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount),
    ).json()
    assert first["consequence"]["state"] == "succeeded"
    assert first["consequence"]["terminated"] is True
    assert adapter.invocation_count == 1


def test_failed_consequence_attempt_terminates_mount(
    client: TestClient, tmp_path: Path
) -> None:
    mount, adapter = prepare(client, tmp_path, FailingAdapter(tmp_path))
    first = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount),
    ).json()
    assert first["consequence"]["state"] == "failed"
    assert first["consequence"]["terminated"] is True
    assert adapter.invocation_count == 1


def test_uncertain_consequence_attempt_terminates_mount(
    client: TestClient, tmp_path: Path
) -> None:
    mount, adapter = prepare(client, tmp_path, UncertainAdapter(tmp_path))
    first = client.post(
        f"/v1/capability/mounts/{mount['mount']['id']}/execute",
        json=execute_payload(mount),
    ).json()
    assert first["consequence"]["state"] == "outcome_unknown"
    assert first["consequence"]["terminated"] is True
    assert adapter.invocation_count == 1
'''
              tests.write_text(t, encoding='utf-8')
          PY

      - name: Install dependencies
        run: pip install -e '.[dev]' psycopg2-binary aiosqlite

      - name: Run capability-mount suite
        run: pytest tests/capability_mount -q

      - name: Run P5/consequence adversarial subset
        run: pytest tests/adversarial -q -k 'p5 or cd_2 or cd_3'

      - name: Lint changed files
        run: ruff check cappo_backend/capability_mount/service.py tests/capability_mount/test_execute_consequence.py

      - name: Commit verified correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'Veklom Verification Bot'
          git config user.email 'reprewindai@gmail.com'
          git rm .github/workflows/_resume_cappo.yml
          git add cappo_backend/capability_mount/service.py tests/capability_mount/test_execute_consequence.py
          git commit -m 'fix(cappo): preserve mount on pre-authorization errors'
          git push origin HEAD:devin/cappo-consequence-execute
