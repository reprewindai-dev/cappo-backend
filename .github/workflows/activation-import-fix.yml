name: Activation one-shot proof repair

on:
  push:
    branches: [activation-e2e-authority-binding]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-proof-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activation-e2e-authority-binding
          fetch-depth: 0

      - name: Apply exact proof-reader repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('cappo_backend/api/routers/execution_proof_router.py')
          text = router.read_text(encoding='utf-8')
          import_anchor = 'from cappo_backend.models.pgl_ledger_event import PGLLedgerEvent\n'
          import_block = (
              import_anchor
              + 'from cappo_backend.security.evidence import (\n'
              + '    get_evidence_public_key,\n'
              + '    verify_signed_execution_evidence,\n'
              + ')\n'
          )
          if 'verify_signed_execution_evidence' not in text:
              if import_anchor not in text:
                  raise SystemExit('execution proof import anchor missing')
              text = text.replace(import_anchor, import_block, 1)

          old = '''    if not receipt.signed_receipt_cose:\n        _fail(\n            "AUTHORIZATION_RECEIPT_SIGNATURE_MISSING",\n            "Authorization receipt is not signed.",\n        )\n    return receipt\n'''
          new = '''    if not receipt.signed_receipt_cose:\n        _fail(\n            "AUTHORIZATION_RECEIPT_SIGNATURE_MISSING",\n            "Authorization receipt is not signed.",\n        )\n    try:\n        signed_payload = verify_signed_execution_evidence(\n            receipt.signed_receipt_cose,\n            get_evidence_public_key(),\n        )\n    except ValueError as exc:\n        _fail(\n            "AUTHORIZATION_RECEIPT_SIGNATURE_INVALID",\n            f"Authorization receipt signature verification failed: {exc}",\n        )\n    if signed_payload != canonical:\n        _fail(\n            "AUTHORIZATION_RECEIPT_SIGNED_PAYLOAD_MISMATCH",\n            "Signed authorization receipt payload does not match the persisted receipt.",\n        )\n    return receipt\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('authorization receipt verification anchor missing')
              text = text.replace(old, new, 1)
          router.write_text(text, encoding='utf-8')

          test = Path('tests/test_execution_proof_projection.py')
          text = test.read_text(encoding='utf-8')
          import_anchor = 'from cappo_backend.services.orchestrator import RunOrchestrator\n'
          import_block = (
              'from cappo_backend.security.evidence import mint_signed_execution_evidence\n'
              + import_anchor
          )
          if 'mint_signed_execution_evidence' not in text:
              if import_anchor not in text:
                  raise SystemExit('proof test import anchor missing')
              text = text.replace(import_anchor, import_block, 1)
          text = text.replace(
              '            signed_receipt_cose=b"signed-proof",\n',
              '            signed_receipt_cose=mint_signed_execution_evidence(canonical),\n',
              1,
          )
          if 'signed_receipt_cose=b"signed-proof"' in text:
              raise SystemExit('synthetic signed-proof fixture remains')
          test.write_text(text, encoding='utf-8')
          PY

      - name: Verify proof reader
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' aiosqlite
          python -m compileall -q cappo_backend
          ruff check \
            cappo_backend/security/evidence.py \
            cappo_backend/api/routers/execution_proof_router.py \
            tests/test_execution_proof_projection.py
          pytest -q tests/test_g0b5_signed_evidence.py tests/test_execution_proof_projection.py --tb=short

      - name: Commit repair to branch
        run: |
          if git diff --quiet; then
            echo 'No proof repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cappo_backend/api/routers/execution_proof_router.py tests/test_execution_proof_projection.py
          git commit -m 'proof: verify signed authorization receipt [auto-proof-fix]'
          git push origin HEAD:activation-e2e-authority-binding
