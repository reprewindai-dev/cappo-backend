name: Repair Sovereign Veklom Web Edge

on:
  push:
    paths:
      - ".github/workflows/repair-sovereign-web-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure Hetzner SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/veklom-deploy
          chmod 600 ~/.ssh/veklom-deploy

      - name: Probe DNS and public edge
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          getent ahostsv4 veklom.com | awk '{print $1}' | sort -u || true
          getent ahostsv4 control.veklom.com | awk '{print $1}' | sort -u || true
          echo '=== PUBLIC HTTP ==='
          for url in https://veklom.com/ https://veklom.com/api/health https://control.veklom.com/; do
            code=$(curl -skL --max-time 15 -o /tmp/body -w '%{http_code}' "$url")
            echo "$url -> HTTP $code"
            head -c 200 /tmp/body | tr '\n' ' '; echo
          done

      - name: Inspect known Hetzner hosts directly
        shell: bash
        run: |
          set +e
          KEY=~/.ssh/veklom-deploy
          for host in 5.78.135.11 87.99.154.166; do
            echo "=== HOST $host ==="
            ssh -i "$KEY" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              root@$host 'bash -s' <<'REMOTE'
          set +e
          echo "hostname=$(hostname)"
          echo "uptime=$(uptime -p 2>/dev/null)"
          echo 'docker:'
          command -v docker || true
          docker version --format '{{.Server.Version}}' 2>/dev/null || true
          echo 'containers:'
          docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}' 2>/dev/null | head -80 || true
          echo 'listeners:'
          ss -lntp 2>/dev/null | grep -E ':(80|443|3002|8000|8088)\b' || true
          echo 'local probes:'
          curl -sS --max-time 5 -o /dev/null -w 'http://127.0.0.1:3002 -> %{http_code}\n' http://127.0.0.1:3002/ || true
          curl -sS --max-time 5 -o /dev/null -w 'http://127.0.0.1:8088 -> %{http_code}\n' http://127.0.0.1:8088/ || true
          curl -sk --max-time 5 -o /dev/null -w 'https://127.0.0.1 Host:veklom.com -> %{http_code}\n' -H 'Host: veklom.com' https://127.0.0.1/ || true
          echo 'cloudflared:'
          pgrep -a cloudflared || true
          docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}' 2>/dev/null | grep -i cloudflared || true
          echo 'candidate frontend paths:'
          find /data /opt /srv /root -maxdepth 4 -type d \( -iname '*veklom*' -o -iname '*control*plane*' \) 2>/dev/null | head -80 || true
          REMOTE
            rc=$?
            echo "ssh_rc=$rc"
          done

      - name: Probe public endpoints after inspection
        shell: bash
        run: |
          set +e
          for url in https://veklom.com/ https://veklom.com/api/health https://control.veklom.com/ https://api.veklom.com/api/v1/health; do
            code=$(curl -skL --max-time 20 -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> HTTP $code"
          done
