[project]
name = "cappo-backend"
version = "0.1.0"
description = "CAPPO runtime backend — governed execution, PGL certificates, ExecutionIdentityV1, and LAW 0 enforcement."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
    "cryptography>=50.0.0",
    "fastapi-x402>=0.1",
    "x402>=0.1",
    "psutil>=5.9",
    "pynacl>=1.5.0",
    "PyJWT[crypto]>=2.8.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
evm = [
    "eth-account>=0.13.7",
    "web3>=7.16.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cappo_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
